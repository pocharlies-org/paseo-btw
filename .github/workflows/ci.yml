name: CI

# No secrets anywhere in this workflow: it runs the code of the pull request on the self-hosted runners. `pull_request`, NEVER
# `pull_request_target`. `--ignore-scripts`: an npm lifecycle script of a dependency must not execute on the runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the history sweep reads every commit
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

      - name: No private data in the tree or the history
        env:
          RANGO: "${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.sha }}"
        run: scripts/check-internal.sh "$RANGO"
