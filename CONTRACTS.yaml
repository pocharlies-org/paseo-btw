# CONTRACTS.yaml: the surfaces other programs consume from this repository.
#
# An active entry is never renamed nor deleted. A breaking change is a new `.vN+1` entry, with the old one set to `status: deprecated`,
# `replaced_by` and `remove_after`. A commit that touches a contract surface updates this registry in the same push and carries the
# trailer `Contract-Change: <action> <id>`.
version: 1
registry_files:
  - CONTRACTS.yaml
contracts:
  - id: rpc.paseo-btw.side-question.v1
    kind: http-route
    value: "agent.side-question"
    role: provider
    files:
      - shared/contract.ts
    status: active
    note: >-
      `agent.side-question` (starts the answer and returns its id) and `agent.side-question.poll` (text so far, done, error, tool, model):
      the only surface between this plugin's panel and its server half. A new shape enters as `.v2` and the old name keeps answering.
      `accountId` left shared/contract.ts with the account service it described; both RPCs keep their shape.
